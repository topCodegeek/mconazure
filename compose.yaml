
services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      MEMORY: "3G"

      # Preserve your existing server.properties
      OVERRIDE_SERVER_PROPERTIES: "false"

    volumes:
      - ./data:/data

    stdin_open: true
    tty: true
