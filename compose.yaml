services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      MEMORY: "1.5G"
      OVERRIDE_SERVER_PROPERTIES: "false"

    volumes:
      - ./data:/data

    # Prevent Docker logs from growing indefinitely.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    stdin_open: true
    tty: true